<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumah Puisi</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--outer:#dacbb8;--paper:#f8f3ea;--panel:#fdf8f0;--ink:#5b4333;--mute:#7d6857;--line:#eadcc7;--edge:#e0d0b9;--acc:#6b5141;--acc-ink:#fbf3e8;--ring:#a07c50;--pink:#f3e8d6;--pink-ink:#8a6a43;--leaf:#ece0ca;--shadow:0 2px 10px rgba(107,81,65,.10);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.65 Nunito,system-ui,sans-serif;background:var(--outer)}
.wrap{max-width:820px;margin:0 auto;min-height:100vh;padding:44px 36px 80px;background:var(--paper);box-shadow:0 0 50px rgba(107,81,65,.25)}
:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
h1{display:flex;align-items:center;gap:12px;font:600 clamp(2rem,7vw,3rem)/1.15 Lora,Georgia,serif;margin:0 0 6px}
.bloom{width:46px;height:46px;flex-shrink:0}
.sub{color:var(--mute);margin:0 0 34px;font-size:1.05rem}
.hero{display:block;width:100%;text-align:left;background:linear-gradient(135deg,var(--pink),var(--leaf));border:0;border-radius:26px;padding:28px;margin-bottom:34px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);font:inherit;transition:transform .2s ease}
.hero:hover{transform:translateY(-2px)}
.hero[hidden]{display:none}
.hero small{display:inline-block;background:var(--panel);color:var(--pink-ink);border-radius:999px;padding:2px 14px;font-weight:700;font-size:.82rem}
.hero h2{font:600 1.7rem/1.25 Lora,Georgia,serif;margin:12px 0 2px}
.hero .m{color:var(--ink);opacity:.8;font-size:.9rem}
.hero pre{font:400 1.2rem/1.9 Lora,Georgia,serif;white-space:pre-wrap;margin:14px 0 0}
input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:999px;padding:11px 18px;width:100%;margin-bottom:14px}
input:focus{border-color:var(--ring);outline:none;box-shadow:0 0 0 3px #ecdcc2}
button{font:inherit;font-weight:700;cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:999px;padding:9px 20px;transition:transform .15s ease,box-shadow .15s ease}
button:hover:not(:disabled){box-shadow:var(--shadow)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button:disabled{opacity:.4;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:4px 16px;font-size:.9rem;font-weight:600}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 22px;font-weight:400;box-shadow:var(--shadow)}
.row:hover{transform:translateY(-2px);border-color:var(--ring)}
.t{font:600 1.22rem/1.35 Lora,Georgia,serif}
.m{color:var(--mute);font-size:.9rem;text-align:right;flex-shrink:0}
.msg{color:var(--mute);padding:22px 4px;text-align:center}

/* ===== Tampilan baca puisi ===== */
.reader{position:fixed;inset:0;display:none;flex-direction:column;background:var(--paper);z-index:9;--ps:1.25rem}
.reader.open{display:flex}
.rbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--paper)}
.grp{display:flex;align-items:center;gap:8px}
.rbar button{padding:7px 16px}
.rscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.rbody{max-width:36rem;margin:0 auto;padding:56px 24px 56px}
.rtag{display:block;color:var(--pink-ink);font-weight:700;letter-spacing:.14em;font-size:.78rem;text-transform:uppercase}
.rtitle{font:600 clamp(1.9rem,6vw,2.6rem)/1.25 Lora,Georgia,serif;margin:10px 0 6px}
.rby{color:var(--mute)}
.orn{width:56px;height:2px;border-radius:2px;background:var(--ring);margin:26px 0 36px}
.poemtxt{font-family:Lora,Georgia,serif;font-size:var(--ps);line-height:2;color:var(--ink)}
.stanza{margin:0 0 1.9em}
.ln{display:block;white-space:pre-wrap;padding-left:1.6em;text-indent:-1.6em}
.rnav{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.rnav button{display:flex;flex-direction:column;gap:2px;max-width:48%;border-radius:18px;padding:10px 18px;text-align:left}
.rnav button:last-child{text-align:right;align-items:flex-end;margin-left:auto}
.rnav small{color:var(--mute);font-weight:600;font-size:.78rem}
.rnav span{font:600 1rem/1.3 Lora,Georgia,serif}
@media (max-width:520px){.wrap{padding:32px 16px 60px}.row{flex-direction:column;gap:2px}.m{text-align:left}.rbody{padding:36px 20px 44px}.rbar{padding:10px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1><svg class="bloom" viewBox="0 0 48 48" aria-hidden="true"><g stroke="#9c5a30" stroke-width="1.2" stroke-linecap="round"><g transform="rotate(-34 24 44)"><path d="M24 5C36 15 39 27 24 44 9 27 12 15 24 5Z" fill="#d4623a"/><path d="M24 44V14" fill="none"/></g><g transform="rotate(34 24 44)"><path d="M24 5C36 15 39 27 24 44 9 27 12 15 24 5Z" fill="#eab543"/><path d="M24 44V14" fill="none"/></g><g><path d="M24 4C36 14 40 27 24 45 8 27 12 14 24 4Z" fill="#e48a2f"/><path d="M24 45V13" fill="none"/></g></g></svg>Rumah Puisi</h1>
  <p class="sub">Kumpulan puisi untuk dibaca pelan-pelan, seperti menikmati secangkir teh hangat di sore musim gugur.</p>
  <button class="hero" id="hero" hidden>
    <small>Puisi hari ini</small>
    <h2 id="hT"></h2><div id="hA" class="m"></div>
    <pre id="hX"></pre>
  </button>
  <input id="q" type="search" placeholder="Cari judul, penyair, atau isi puisi" aria-label="Cari puisi">
  <div class="chips" id="chips"></div>
  <ul id="list"></ul>
  <div class="msg" id="msg"></div>
</div>

<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="rTitle">
  <div class="rbar">
    <button class="pri" id="rClose">Tutup</button>
    <div class="grp" role="group" aria-label="Ukuran huruf">
      <button id="fMin" aria-label="Perkecil huruf">A-</button>
      <button id="fPlus" aria-label="Perbesar huruf">A+</button>
    </div>
  </div>
  <div class="rscroll" id="rScroll">
    <article class="rbody">
      <span class="rtag" id="rTag"></span>
      <h2 class="rtitle" id="rTitle"></h2>
      <div class="rby" id="rBy"></div>
      <div class="orn" aria-hidden="true"></div>
      <div class="poemtxt" id="rText"></div>
      <nav class="rnav" aria-label="Puisi lainnya">
        <button id="rPrev"><small>Sebelumnya</small><span id="rPrevT"></span></button>
        <button id="rNext"><small>Berikutnya</small><span id="rNextT"></span></button>
      </nav>
    </article>
  </div>
</div>

<script src="script.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

/* Rapikan isi puisi: hapus spasi indentasi bersama, baris kosong di awal/akhir */
function tidy(t){
  var lines=String(t).replace(/\r\n?/g,"\n").replace(/\t/g,"  ").split("\n");
  var min=Infinity;
  lines.forEach(function(l){if(l.trim()){min=Math.min(min,l.match(/^ */)[0].length)}});
  if(min===Infinity)min=0;
  return lines.map(function(l){return l.slice(Math.min(min,l.match(/^ */)[0].length)).replace(/\s+$/,"")}).join("\n").replace(/^\n+|\n+$/g,"");
}
var raw=Array.isArray(window.PUISI)?window.PUISI:[];
var poems=raw.filter(function(p){return p&&typeof p.judul==="string"&&typeof p.isi==="string"&&p.judul.trim()&&p.isi.trim()})
  .map(function(p,i){return {id:i,title:p.judul.trim(),author:String(p.penyair||"").trim(),category:String(p.kategori||"").trim(),text:tidy(p.isi)}});

var cat="Semua",shown=[],list=[],idx=-1,opener=null,SIZES=[1.05,1.15,1.25,1.4,1.6,1.8],size=2;
try{var sv=parseInt(localStorage.getItem("rp_size"),10);if(sv>=0&&sv<SIZES.length)size=sv}catch(e){}

function hero(){
  var h=$("hero");
  if(!poems.length){h.hidden=true;return}
  var i=Math.floor(Date.now()/864e5)%poems.length,p=poems[i];
  $("hT").textContent=p.title;
  $("hA").textContent=p.author||"Anonim";
  $("hX").textContent=p.text.split("\n").filter(function(l){return l.trim()}).slice(0,4).join("\n");
  h.hidden=false;
  h.onclick=function(){openReader(poems,i,h)};
}
function render(){
  var q=$("q").value.trim().toLowerCase(),cats=["Semua"];
  poems.forEach(function(p){if(p.category&&cats.indexOf(p.category)<0)cats.push(p.category)});
  if(cats.indexOf(cat)<0)cat="Semua";
  $("chips").innerHTML=cats.length>2?cats.map(function(c){return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join(""):"";
  shown=poems.filter(function(p){
    if(cat!=="Semua"&&p.category!==cat)return false;
    return !q||(p.title+" "+p.author+" "+p.text+" "+p.category).toLowerCase().indexOf(q)>=0;
  });
  $("list").innerHTML=shown.map(function(p,i){
    return '<li><button class="row" data-i="'+i+'"><span class="t">'+esc(p.title)+'</span><span class="m">'+esc(p.author||"Anonim")+(p.category?", "+esc(p.category):"")+'</span></button></li>';
  }).join("");
  $("msg").textContent=shown.length?"":(poems.length?"Tidak ada puisi yang cocok dengan pencarian.":"Belum ada puisi.");
}

function applySize(){
  $("reader").style.setProperty("--ps",SIZES[size]+"rem");
  $("fMin").disabled=size===0;$("fPlus").disabled=size===SIZES.length-1;
  try{localStorage.setItem("rp_size",String(size))}catch(e){}
}
function fill(){
  var p=list[idx];
  $("rTag").textContent=p.category;$("rTag").hidden=!p.category;
  $("rTitle").textContent=p.title;
  $("rBy").textContent=p.author?"oleh "+p.author:"";
  $("rText").innerHTML=p.text.split(/\n[ \t]*\n+/).map(function(st){
    return '<p class="stanza">'+st.split("\n").map(function(l){return '<span class="ln">'+esc(l)+'</span>'}).join("")+'</p>';
  }).join("");
  var pv=list[idx-1],nx=list[idx+1];
  $("rPrev").disabled=!pv;$("rPrevT").textContent=pv?pv.title:"";
  $("rNext").disabled=!nx;$("rNextT").textContent=nx?nx.title:"";
  $("rPrev").style.visibility=pv?"visible":"hidden";$("rNext").style.visibility=nx?"visible":"hidden";
  $("rScroll").scrollTop=0;
}
function openReader(l,i,from){
  list=l;idx=i;opener=from||null;fill();applySize();
  $("reader").classList.add("open");document.body.style.overflow="hidden";$("rClose").focus();
}
function closeReader(){
  $("reader").classList.remove("open");document.body.style.overflow="";
  if(opener&&opener.isConnected)opener.focus();
}
function go(d){if(list[idx+d]){idx+=d;fill()}}
function isOpen(){return $("reader").classList.contains("open")}

$("chips").onclick=function(e){var b=e.target.closest(".chip");if(b){cat=b.getAttribute("data-c");render()}};
$("q").oninput=render;
$("list").onclick=function(e){var b=e.target.closest(".row");if(b)openReader(shown,+b.getAttribute("data-i"),b)};
$("rClose").onclick=closeReader;
$("rPrev").onclick=function(){go(-1)};
$("rNext").onclick=function(){go(1)};
$("fMin").onclick=function(){if(size>0){size--;applySize()}};
$("fPlus").onclick=function(){if(size<SIZES.length-1){size++;applySize()}};
document.addEventListener("keydown",function(e){
  if(!isOpen())return;
  if(e.key==="Escape")closeReader();
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
});

hero();render();
})();
</script>
</body>
</html>
